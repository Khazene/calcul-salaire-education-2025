name: Obfuscate and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install JavaScript Obfuscator
      run: npm install -g javascript-obfuscator

    - name: Obfuscate pro.js
      run: |
        javascript-obfuscator ./pro.js --output ./pro.js --compact true --control-flow-flattening true --control-flow-flattening-threshold 0.7 --string-array true --string-array-encoding 'base64' --string-array-threshold 0.8

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: . 
        branch: gh-pages
